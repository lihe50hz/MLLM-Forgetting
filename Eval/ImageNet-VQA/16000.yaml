### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
adapter_name_or_path: saves/qwen2_5vl-7b/lora-sft-imagenet-vqa/checkpoint-16000
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_predict: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
eval_dataset: imagenet_vqa_val  # video: mllm_video_demo
template: qwen2_vl
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2_5vl-7b/lora-sft-imagenet-vqa/checkpoint-16000/eval
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen2_5vl-7b-lora-sft-imagenet-vqa-checkpoint-16000

### eval
per_device_eval_batch_size: 8
predict_with_generate: true
ddp_timeout: 180000000
flash_attn: fa2
