# Example YAML configuration for linear weight merging
# LLaVA-1.5-7B model checkpoints

# Path to the first model checkpoint
checkpoint1: "saves/llava-7b/full-sft-imagenet-vqa/checkpoint-40000"

# Path to the second model checkpoint
checkpoint2: "saves/llava-7b/full-lowlr-sft-imagenet-vqa/checkpoint-40000"

# Interpolation weight (0.0 to 1.0)
# 0.7 means 70% from checkpoint1 and 30% from checkpoint2
lambda_weight: 0.7

# Path to save the merged model
output_path: "saves/llava-7b/merged-70-30-weight"

# Device to perform merging on
device: "cuda"  # Use GPU for faster processing with large models 