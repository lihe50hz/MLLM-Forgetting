# Example YAML configuration for linear weight merging
# Qwen2.5-VL model checkpoints

# Path to the first model checkpoint
checkpoint1: "saves/qwen2_5vl-3b/full-sft-imagenet-vqa/checkpoint-50000"

# Path to the second model checkpoint  
checkpoint2: "saves/qwen2_5vl-3b/full-sft-imagenet-vqa/checkpoint-50000"

# Interpolation weight (0.0 to 1.0)
# Formula: lambda * model1 + (1-lambda) * model2
# 0.5 = equal mixing, 0.7 = 70% model1 + 30% model2, etc.
lambda_weight: 0.5

# Path to save the merged model
output_path: "saves/qwen2_5vl-3b/merged-equal-weight"

# Device to perform merging on ("cpu" or "cuda")
device: "cpu"

# Additional notes:
# - Both checkpoints must be from the same model architecture
# - The merged model will include tokenizer and processor from checkpoint1
# - Ensure you have enough disk space for the merged model
# - Use "cuda" device for faster merging if you have GPU available 