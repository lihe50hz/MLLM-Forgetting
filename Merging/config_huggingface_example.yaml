# Example YAML configuration for linear weight merging
# Using HuggingFace model identifiers (downloaded automatically)

# HuggingFace model identifier for Qwen2.5-VL base model
checkpoint1: "Qwen/Qwen2.5-VL-3B-Instruct"

# Local checkpoint path (fine-tuned model)
checkpoint2: "saves/qwen2_5vl-3b/full-sft-imagenet-vqa/checkpoint-50000"

# Interpolation weight (0.0 to 1.0)
# 0.8 = 80% base model + 20% fine-tuned model
lambda_weight: 0.8

# Path to save the merged model
output_path: "saves/qwen2_5vl-3b/merged-base80-finetuned20"

# Device to perform merging on
device: "cpu"

# Mixed path examples:
# - "Qwen/Qwen2.5-VL-3B-Instruct" (HuggingFace)
# - "liuhaotian/llava-v1.5-7b" (HuggingFace)
# - "saves/model/checkpoint-1000" (Local)
# - "/absolute/path/to/model" (Local absolute)
# - "relative/path/to/model" (Local relative) 