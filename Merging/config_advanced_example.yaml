# Advanced example: Merging different training strategies
# This example shows merging a full fine-tuned model with a projector-only trained model

# Base model checkpoint (full fine-tuning)
checkpoint1: "saves/qwen2_5vl-3b/full-sft-imagenet-vqa/checkpoint-80000"

# Specialized model checkpoint (projector training)
checkpoint2: "saves/qwen2_5vl-3b/projector-sft-imagenet-vqa/checkpoint-80000"

# Small lambda to preserve most of the full model while adding some projector specialization
# 0.9 = 90% full model + 10% projector model
lambda_weight: 0.9

# Output path with descriptive name
output_path: "saves/qwen2_5vl-3b/merged-full90-projector10"

# Use CPU for merging (safer for memory management)
device: "cpu"

# Use cases for different lambda values:
# - lambda = 0.1: Mostly second model, slight influence from first
# - lambda = 0.3: 30% first model, 70% second model  
# - lambda = 0.5: Equal mixing (ensemble-like behavior)
# - lambda = 0.7: Mostly first model, some second model characteristics
# - lambda = 0.9: Almost entirely first model, subtle second model influence 